spring.application.name=Spring-Security-Intro
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/task_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration - USE THIS DIALECT INSTEAD
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# OR try this if the above doesn't work:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Other JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Optional: Set naming strategy to avoid issues
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl