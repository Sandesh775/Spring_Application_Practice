spring.application.name=Spring-Security-Authorization-with-Database-Users
spring.datasource.url=jdbc:mysql://localhost:3306/security_authorization_demo
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Log SQL parameters (shows actual values)
spring.jpa.properties.hibernate.use_sql_comments=true

# Show bind parameters (the actual values)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE